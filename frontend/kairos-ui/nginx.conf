server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and telemetry to Kairos Gateway
    location /api/ {
        proxy_pass http://kairos-gateway:5900/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://kairos-gateway:5900/health;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://kairos-gateway:5900/metrics;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://kairos-gateway:5900/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
